name: Foundation CI
on:
  push:
  pull_request:
  schedule:
    # Weekly dependency audit so new advisories surface without a push.
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: devcontext
          POSTGRES_PASSWORD: devcontext
          POSTGRES_DB: devcontext_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U devcontext -d devcontext_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://devcontext:devcontext@localhost:5432/devcontext_test
      NEXT_TELEMETRY_DISABLED: "1"
      TURBO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.0.10
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Dependency vulnerability audit (fails on high or critical)
        run: pnpm audit --audit-level=high
      - run: pnpm db:generate
      - name: Check committed migration matches schema
        run: git diff --exit-code -- packages/db/drizzle && test -z "$(git ls-files --others --exclude-standard packages/db/drizzle)"
      - run: pnpm db:migrate
      - name: PostgreSQL drills (migration replay, backup/restore, concurrency)
        run: pnpm test:db
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - name: Client bundle contains no server-only variable names or connection strings
        run: node scripts/verify-bundle.mjs
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v7.0.1
        if: failure()
        with:
          name: playwright-results
          path: test-results/

  containers:
    # Production images are built from the same commit, started as a preview
    # stack (own PostgreSQL, migrations as a release step) and smoke-checked:
    # liveness, readiness, sign-up, authenticated and owner-scoped reads,
    # a protected page, anonymous refusal and account deletion.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: verify
    env:
      DEVCONTEXT_ENV_FILE: ./env/ci.env
      RELEASE: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .node-version
      - name: Build images and start the preview stack (migrate → api → web)
        run: docker compose -f deploy/compose.staging.yml up -d --build --wait --wait-timeout 300
      - name: Post-deploy smoke check
        run: node scripts/smoke.mjs --web http://127.0.0.1:3100 --api http://127.0.0.1:4100
      - name: Graceful shutdown drains and logs lifecycle events
        run: |
          docker compose -f deploy/compose.staging.yml stop api
          docker compose -f deploy/compose.staging.yml logs api | grep -E "shutdown_started|shutdown_complete"
      - name: Stack logs
        if: failure()
        run: docker compose -f deploy/compose.staging.yml logs --tail 200
      - name: Tear down (volumes included; nothing from this stack is kept)
        if: always()
        run: docker compose -f deploy/compose.staging.yml down -v
