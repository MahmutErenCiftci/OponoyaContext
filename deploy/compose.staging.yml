# Staging / preview stack built from the repository images (Handoff 12).
#
#   DEVCONTEXT_ENV_FILE=./env/staging.env docker compose -f deploy/compose.staging.yml up -d --build --wait
#   node scripts/smoke.mjs --web http://127.0.0.1:3100 --api http://127.0.0.1:4100
#
# Migrations run as a one-shot release step (`migrate`) before the API starts;
# the API never mutates the schema on boot. This stack owns its own PostgreSQL
# volume and must never be pointed at the production database. Ports bind to
# 127.0.0.1 only; put a TLS terminator in front for anything reachable.
name: devcontext-staging

services:
  postgres:
    image: postgres:18.6-alpine
    env_file:
      - ${DEVCONTEXT_ENV_FILE:-./env/staging.env}
    volumes:
      - devcontext_staging_pg:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-devcontext} -d $${POSTGRES_DB:-devcontext}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  migrate:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    image: devcontext-api:${RELEASE:-local}
    env_file:
      - ${DEVCONTEXT_ENV_FILE:-./env/staging.env}
    command: ["node", "node_modules/@devcontext/db/dist/migrate.js"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    image: devcontext-api:${RELEASE:-local}
    env_file:
      - ${DEVCONTEXT_ENV_FILE:-./env/staging.env}
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${API_PUBLISH_PORT:-4100}:4000"
    stop_grace_period: 15s
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    image: devcontext-web:${RELEASE:-local}
    environment:
      NODE_ENV: production
      API_URL: http://api:4000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_PUBLISH_PORT:-3100}:3000"
    stop_grace_period: 15s
    restart: unless-stopped

volumes:
  devcontext_staging_pg:
