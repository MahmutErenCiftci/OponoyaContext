services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: devcontext
      POSTGRES_PASSWORD: devcontext
      POSTGRES_DB: devcontext
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - devcontext_pg:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devcontext -d devcontext"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  devcontext_pg:
